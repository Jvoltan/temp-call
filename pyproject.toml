[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "pydantic>=2.13.4",
    "torch>=2.0.0",
    "python-box>=7.0.0",
    "llm-sdk",
]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "flake8>=7.0.0",
]

[tool.mypy]
exclude = ["llm_sdk/", ".venv/"]

[[tool.mypy.overrides]]
module = "llm_sdk.*"
follow_imports = "skip"
ignore_missing_imports = true

[tool.uv]
package = false
default-groups = ["dev"]
cache-dir = "./.uv-cache"

[tool.uv.sources]
llm-sdk = { workspace = true }

[tool.uv.workspace]
members = [
    "llm_sdk",
]
